<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KARNER Anamorfik Katalog</title>
<meta name="description" content="KARNER anamorphic 3D LED work: corner, convex, angled and flat screens.">
<meta name="robots" content="noindex">
<link rel="icon" href="/katalog/logo-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: koyu bir gösterim salonu. Her iş bir satır: solda ekran (video), sağda kısa metin. Marka kimliğine bağlı tek, koyu görünüm. */
  :root {
    --zemin: #121630;        /* marka laciverti #151A33'ün bir ton koyusu */
    --yuzey: #1b2142;        /* video kutusu */
    --cizgi: #2b3260;
    --yazi: #eef0f6;
    --gumus: #c0c4cc;        /* marka gümüşü */
    --soluk: #a7abc0;
    --mor: #6e28c9;          /* marka moru */
    --mor-acik: #a77bf0;     /* koyu zeminde okunur mor */
    --f: "Montserrat", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--zemin); color: var(--yazi); font-family: var(--f); font-size: 16px; line-height: 1.6; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .kap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  header.ust { padding-block: 32px 28px; border-bottom: 1px solid var(--cizgi); }
  .ust-satir { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .marka { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
  .marka img { width: 52px; height: 52px; display: block; }
  .kelime { font-weight: 700; font-size: 24px; letter-spacing: 0.2em; line-height: 1; color: var(--gumus); }
  .kelime b { color: var(--mor-acik); font-weight: 700; }
  .alt-yazi { display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soluk); margin-top: 6px; font-weight: 500; }
  .diller { display: flex; gap: 4px; border: 1px solid var(--cizgi); border-radius: 999px; padding: 3px; }
  .diller a { font: 600 13px/1 var(--f); letter-spacing: 0.08em; color: var(--soluk); text-decoration: none; padding: 8px 12px; border-radius: 999px; }
  .diller a[aria-current="true"] { background: var(--mor); color: #fff; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--mor-acik); outline-offset: 2px; }
  h1 { font-weight: 700; font-size: clamp(30px, 4.6vw, 52px); line-height: 1.1; margin: 36px 0 14px; text-wrap: balance; max-width: 20ch; }
  .giris { color: var(--soluk); font-size: 18px; max-width: 62ch; margin: 0; }
  .ekranlar { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; padding: 0; list-style: none; }
  .ekranlar li { font-size: 13px; letter-spacing: 0.03em; color: var(--yazi); border: 1px solid var(--cizgi); border-radius: 999px; padding: 5px 12px; }

  main { display: grid; gap: 56px; padding-block: 48px; }
  .is { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 32px; align-items: center; }
  .ekran { position: relative; aspect-ratio: 16 / 10; max-width: 100%; background: var(--yuzey); border-radius: 6px; overflow: hidden; }
  .ekran video { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--yuzey); }
  .ekran .oynat { position: absolute; right: 12px; bottom: 12px; font: 600 12px/1 var(--f); color: #fff; background: rgba(18,22,48,.8); border: 1px solid var(--cizgi); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
  .metin { min-width: 0; }
  .etiketler { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mor-acik); font-weight: 600; margin-bottom: 10px; }
  .etiketler .konsept { color: var(--soluk); }
  .is h2 { font-weight: 700; font-size: 24px; line-height: 1.25; margin: 0 0 10px; text-wrap: balance; }
  .is p { margin: 0; color: var(--soluk); max-width: 46ch; }

  section.surec { border-top: 1px solid var(--cizgi); padding-block: 44px; }
  section.surec h2 { font-size: 26px; margin: 0 0 22px; }
  .adimlar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; list-style: none; padding: 0; margin: 0; }
  .adimlar li { border-top: 2px solid var(--mor); padding-top: 14px; }
  .adimlar h3 { font-size: 18px; margin: 0 0 6px; }
  .adimlar p { margin: 0; color: var(--soluk); }

  footer { border-top: 1px solid var(--cizgi); padding-block: 36px 56px; }
  .iletisim { display: flex; flex-wrap: wrap; gap: 14px 36px; align-items: center; }
  .iletisim a { color: var(--yazi); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--mor-acik); }
  .iletisim span { color: var(--soluk); }
  .not { color: var(--soluk); font-size: 13px; margin: 20px 0 0; max-width: 80ch; }

  @media (max-width: 760px) {
    .is { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .adimlar { grid-template-columns: minmax(0, 1fr); }
    main { gap: 44px; }
    .marka img { width: 44px; height: 44px; }
    .kelime { font-size: 20px; }
  }
</style>
</head>
<body>

<header class="ust">
  <div class="kap">
    <div class="ust-satir">
      <a class="marka" href="https://karneryazilim.com">
        <img src="/katalog/logo-emblem.png" alt="" width="52" height="52">
        <span><span class="kelime"><b>K</b>AR<b>N</b>ER</span><span class="alt-yazi" data-t="altYazi"></span></span>
      </a>
      <nav class="diller" aria-label="Language">
        <a href="#tr" data-dil="tr">TR</a>
        <a href="#en" data-dil="en">EN</a>
        <a href="#de" data-dil="de">DE</a>
      </nav>
    </div>
    <h1 data-t="baslik"></h1>
    <p class="giris" data-t="giris"></p>
    <ul class="ekranlar" id="ekranlar"></ul>
  </div>
</header>

<main class="kap" id="isler"></main>

<section class="surec">
  <div class="kap">
    <h2 data-t="surecBaslik"></h2>
    <ol class="adimlar" id="adimlar"></ol>
  </div>
</section>

<footer>
  <div class="kap">
    <div class="iletisim">
      <a href="mailto:karneryazilim@gmail.com">karneryazilim@gmail.com</a>
      <a href="tel:+905442188645">+90 544 218 86 45</a>
      <a href="https://karneryazilim.com">karneryazilim.com</a>
      <span data-t="sehir"></span>
    </div>
    <p class="not" data-t="not"></p>
  </div>
</footer>

<script>
const YOL = "/katalog/";
const METIN = {
  tr: {
    altYazi: "Yazılım ve Medya Şirketi",
    baslik: "Ekranın dışına taşan 3D videolar",
    giris: "KARNER, LED ekranlar için anamorfik 3D video üretir. Her video, ekranın ölçüsüne ve izleyicinin baktığı noktaya göre hesaplanır; nesne çerçeveden çıkıp sokağa taşıyormuş gibi görünür.",
    ekranlar: ["Köşe ekran", "Dışbükey ekran", "45° açılı ekran", "Düz ekran", "Bina cephesi"],
    surecBaslik: "Nasıl çalışıyoruz",
    adimlar: [
      ["Ekranınızı tanıyoruz", "Ekranın ölçüsü, köşe açısı ve izleyicinin genelde durduğu yer."],
      ["Yerinde önizleme", "Videoyu yayına girmeden önce kendi ekranınızın görüntüsü üzerinde gösteriyoruz."],
      ["Teslim", "Ekranınızın oynatıcısına hazır dosya. Gerekirse farklı ekran ölçülerine uyarlama."]
    ],
    sehir: "Muğla & Ankara, Türkiye",
    not: "“Konsept” işaretli çalışmalar KARNER’in kendi denemeleridir; ilgili marka tarafından sipariş edilmemiştir. Markalar yalnızca tanıtım amacıyla gösterilmiştir.",
    konsept: "Konsept çalışma",
    oynat: "Oynat"
  },
  en: {
    altYazi: "Software & Media Company",
    baslik: "3D videos that step out of the screen",
    giris: "KARNER makes anamorphic 3D videos for LED screens. Every piece is calculated for the size of the screen and the spot people look from, so the object seems to break out of the frame into the street.",
    ekranlar: ["Corner screens", "Convex screens", "45° angled screens", "Flat screens", "Building façades"],
    surecBaslik: "How we work",
    adimlar: [
      ["We study your screen", "Size, corner angle and where viewers usually stand."],
      ["On-site preview", "Before it goes live, you see the video on an image of your own screen."],
      ["Delivery", "A file ready for your screen’s player, plus versions for other screen sizes if needed."]
    ],
    sehir: "Muğla & Ankara, Türkiye",
    not: "Work marked “Concept” is KARNER’s own study and was not commissioned by the brand shown. Brands appear for illustration only.",
    konsept: "Concept work",
    oynat: "Play"
  },
  de: {
    altYazi: "Software- und Medienunternehmen",
    baslik: "3D-Videos, die aus dem Bildschirm treten",
    giris: "KARNER produziert anamorphe 3D-Videos für LED-Bildschirme. Jedes Video wird für die Größe des Bildschirms und den Blickpunkt der Passanten berechnet, damit das Objekt aus dem Rahmen auf die Straße zu kommen scheint.",
    ekranlar: ["Eckbildschirme", "Konvexe Bildschirme", "45°-Bildschirme", "Flache Bildschirme", "Gebäudefassaden"],
    surecBaslik: "So arbeiten wir",
    adimlar: [
      ["Wir lernen Ihren Bildschirm kennen", "Größe, Eckwinkel und der Ort, von dem aus Passanten schauen."],
      ["Vorschau vor Ort", "Vor dem Start sehen Sie das Video auf einem Bild Ihres eigenen Bildschirms."],
      ["Lieferung", "Eine Datei, bereit für Ihren Player, bei Bedarf in Versionen für andere Bildschirmgrößen."]
    ],
    sehir: "Muğla & Ankara, Türkei",
    not: "Als „Konzept“ markierte Arbeiten sind eigene Studien von KARNER und wurden nicht von der gezeigten Marke beauftragt. Marken dienen nur der Veranschaulichung.",
    konsept: "Konzeptarbeit",
    oynat: "Abspielen"
  }
};

// Her iş: video, ekran türü (3 dil), başlık ve açıklama (3 dil), konsept mi
const ISLER = [
  { v: "01-thy", konsept: true,
    ekran: { tr: "90° köşe ekran", en: "90° corner screen", de: "90°-Eckbildschirm" },
    tr: ["Afişten uçağa", "Düz bir afiş köşe ekranda 3D bir sahneye dönüşüyor. Uçak köşeden sokağa taşıyor; ekranın iki yüzü tek bir pencere gibi çalışıyor."],
    en: ["From poster to plane", "A flat poster turns into a 3D scene on a corner screen. The plane breaks out at the corner, so both faces of the screen work as one window."],
    de: ["Vom Plakat zum Flugzeug", "Ein flaches Plakat wird auf dem Eckbildschirm zur 3D-Szene. Das Flugzeug tritt an der Ecke heraus, und beide Seiten wirken wie ein einziges Fenster."] },
  { v: "02-tramvay",
    ekran: { tr: "45° köşe ekran", en: "45° corner screen", de: "45°-Eckbildschirm" },
    tr: ["Tünelden gelen tramvay", "Bina köşesindeki ekran bir tünele açılıyor ve tramvay içeriden sokağa doğru geliyor. Gerçek bina üzerinde simülasyon."],
    en: ["A tram out of the tunnel", "The screen on the building corner opens into a tunnel, and a tram rolls out toward the street. Shown as a simulation on the real building."],
    de: ["Straßenbahn aus dem Tunnel", "Der Bildschirm an der Gebäudeecke öffnet sich zu einem Tunnel, aus dem eine Straßenbahn Richtung Straße fährt. Simulation am realen Gebäude."] },
  { v: "03-chok",
    ekran: { tr: "Dışbükey ekran", en: "Convex screen", de: "Konvexer Bildschirm" },
    tr: ["Chok kahve", "Kahve bardağı çerçeveyi aşıp izleyiciye doğru kayıyor. Yanları 45° açılı, dışbükey bir kafe ekranı için hazırlandı."],
    en: ["Chok coffee", "The coffee cup slides past the frame toward the viewer. Made for a convex café screen with 45° angled sides."],
    de: ["Chok Kaffee", "Der Kaffeebecher gleitet über den Rahmen hinaus auf den Betrachter zu. Gebaut für einen konvexen Café-Bildschirm mit 45°-Seiten."] },
  { v: "04-parfum",
    ekran: { tr: "45° köşe ekran", en: "45° corner screen", de: "45°-Eckbildschirm" },
    tr: ["Parfüm şişesi", "Şişe binanın köşe ekranında kutusundan çıkıp öne süzülüyor. Tek ürüne odaklanan sade bir tanıtım kurgusu."],
    en: ["Perfume bottle", "On the building’s corner screen, the bottle rises out of its box and floats forward. A clean product spot focused on one object."],
    de: ["Parfümflakon", "Auf dem Eckbildschirm des Gebäudes steigt der Flakon aus seiner Box und schwebt nach vorn. Ein klarer Produktspot mit einem einzigen Objekt."] },
  { v: "05-muzlu-sut",
    ekran: { tr: "Köşe ekran", en: "Corner screen", de: "Eckbildschirm" },
    tr: ["Muzlu süt", "Şişe ve bardak, köşe ekranın içindeki rafların önüne çıkıyor. Köşenin iki yüzü birlikte derinlik hissi veriyor."],
    en: ["Banana milk", "The bottle and glass come forward in front of the shelves inside the corner screen. The two faces of the corner create the depth together."],
    de: ["Bananenmilch", "Flasche und Glas treten vor die Regale im Inneren des Eckbildschirms. Die beiden Seiten der Ecke erzeugen gemeinsam die Tiefe."] },
  { v: "06-mundo",
    ekran: { tr: "Dışbükey ekran", en: "Convex screen", de: "Konvexer Bildschirm" },
    tr: ["Mundo", "Ürün kutusu ve horoz maskotu ekranın kenarlarından taşıyor. Üç parçalı ekran tek bir vitrin gibi kullanılıyor."],
    en: ["Mundo", "The product box and rooster mascot spill over the edges of the screen. A three-part screen used as one shop window."],
    de: ["Mundo", "Produktbox und Hahn-Maskottchen ragen über die Ränder des Bildschirms. Ein dreiteiliger Bildschirm wird zu einem einzigen Schaufenster."] },
  { v: "07-ayran",
    ekran: { tr: "Dışbükey ekran", en: "Convex screen", de: "Konvexer Bildschirm" },
    tr: ["Yörsan Ayran", "Şişe yeşil kutunun içinden izleyiciye doğru dönüyor. Ekrana 3 metreden bakan birinin gördüğü haliyle."],
    en: ["Yörsan Ayran", "The bottle turns toward the viewer from inside the green box. Shown as a person sees it from 3 metres away."],
    de: ["Yörsan Ayran", "Die Flasche dreht sich aus der grünen Box heraus zum Betrachter. So, wie man es aus 3 Metern Entfernung sieht."] },
  { v: "08-uzay",
    ekran: { tr: "Üç panelli ekran", en: "Three-panel screen", de: "Dreiteiliger Bildschirm" },
    tr: ["Uzaya açılan pencere", "KARNER’in kendi tanıtım işi: uzaya açılan bir pencereden cam şişe çıkıyor. Üç panelli bir ekran için hazırlandı."],
    en: ["A window into space", "KARNER’s own showcase: a glass bottle comes out of a window into space. Made for a three-panel screen."],
    de: ["Ein Fenster ins All", "KARNERs eigenes Showcase: Eine Glasflasche kommt aus einem Fenster ins All. Für einen dreiteiligen Bildschirm gemacht."] },
  { v: "09-gratis", konsept: true,
    ekran: { tr: "AVM ekranı", en: "Mall screen", de: "Bildschirm im Einkaufszentrum" },
    tr: ["Ruj", "Model ruju AVM ekranının içinden izleyiciye uzatıyor. Düz bir ekranda bile çerçeve ve gölgeyle derinlik kuruluyor."],
    en: ["Lipstick", "The model holds the lipstick out of the mall screen toward the viewer. Frame and shadow create depth even on a flat screen."],
    de: ["Lippenstift", "Das Model reicht den Lippenstift aus dem Bildschirm im Einkaufszentrum heraus. Rahmen und Schatten erzeugen Tiefe, selbst auf einem flachen Bildschirm."] },
  { v: "10-anka",
    ekran: { tr: "Düz ekran", en: "Flat screen", de: "Flacher Bildschirm" },
    tr: ["Anka kuşu", "Ateşten bir anka kuşu şehrin üzerinden gelip ekranın camını kırarak dışarı çıkıyor."],
    en: ["Phoenix", "A fiery phoenix flies in over the city and breaks through the glass of the screen."],
    de: ["Phönix", "Ein feuriger Phönix fliegt über die Stadt heran und durchbricht das Glas des Bildschirms."] },
  { v: "11-vega",
    ekran: { tr: "Bina cephesi", en: "Building façade", de: "Gebäudefassade" },
    tr: ["Vega AVM", "AVM’nin kule cephesindeki ekran açılıyormuş gibi görünüyor ve içinden sürpriz çıkıyor. Binanın biçimine göre hazırlandı."],
    en: ["Vega mall", "The screen on the mall’s tower façade seems to open up, and a surprise comes out. Made to fit the shape of the building."],
    de: ["Vega Einkaufszentrum", "Der Bildschirm an der Turmfassade scheint sich zu öffnen, und eine Überraschung kommt heraus. Passend zur Form des Gebäudes gemacht."] }
];

const isler = document.getElementById("isler");
ISLER.forEach((is, i) => {
  const el = document.createElement("article");
  el.className = "is";
  el.innerHTML = `
    <div class="ekran">
      <video muted loop playsinline preload="${i < 2 ? "auto" : "none"}" poster="${YOL}v/${is.v}.jpg" src="${YOL}v/${is.v}.mp4"></video>
      <button class="oynat" type="button" hidden></button>
    </div>
    <div class="metin">
      <div class="etiketler"><span class="tur"></span>${is.konsept ? '<span class="konsept"></span>' : ""}</div>
      <h2></h2>
      <p></p>
    </div>`;
  isler.appendChild(el);
  is.el = el;
});

function dilUygula(dil) {
  const M = METIN[dil];
  document.documentElement.lang = dil;
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = M[n.dataset.t]; });
  document.getElementById("ekranlar").innerHTML = M.ekranlar.map(e => `<li>${e}</li>`).join("");
  document.getElementById("adimlar").innerHTML = M.adimlar.map(([b, a]) => `<li><h3>${b}</h3><p>${a}</p></li>`).join("");
  ISLER.forEach(is => {
    is.el.querySelector(".tur").textContent = is.ekran[dil];
    const k = is.el.querySelector(".konsept"); if (k) k.textContent = M.konsept;
    is.el.querySelector("h2").textContent = is[dil][0];
    is.el.querySelector("p").textContent = is[dil][1];
    is.el.querySelector(".oynat").textContent = M.oynat;
    is.el.querySelector("video").setAttribute("aria-label", is[dil][0]);
  });
  document.querySelectorAll(".diller a").forEach(a => a.setAttribute("aria-current", a.dataset.dil === dil ? "true" : "false"));
}
function hashDil() { const h = location.hash.replace("#", ""); return METIN[h] ? h : "en"; }
dilUygula(hashDil());
addEventListener("hashchange", () => dilUygula(hashDil()));

// Videolar ekrana girince oynar, çıkınca durur. Hareket azaltma açıksa yalnız butonla oynar.
const azHareket = matchMedia("(prefers-reduced-motion: reduce)").matches;
document.querySelectorAll(".ekran").forEach(kutu => {
  const v = kutu.querySelector("video"), b = kutu.querySelector(".oynat");
  b.addEventListener("click", () => { v.play().then(() => { b.hidden = true; }).catch(() => {}); });
  if (azHareket) b.hidden = false;
});
if (!azHareket && "IntersectionObserver" in window) {
  const io = new IntersectionObserver(girdiler => girdiler.forEach(g => {
    const v = g.target.querySelector("video"), b = g.target.querySelector(".oynat");
    if (g.isIntersecting) v.play().then(() => { b.hidden = true; }).catch(() => { b.hidden = false; });
    else v.pause();
  }), { threshold: 0.35 });
  document.querySelectorAll(".ekran").forEach(k => io.observe(k));
}
</script>
</body>
</html>
